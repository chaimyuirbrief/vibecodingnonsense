[project]
name = "lazarus"
version = "0.1.0"
description = "Compliance-first dead-lead reactivation engine: durable outreach state machine, deterministic guardrails, optional LLM assist."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10", "anthropic>=1.0"]

[project.scripts]
lazarus = "lazarus.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lazarus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: longer simulations"]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S", "SIM", "RUF"]
ignore = ["S101", "S311", "S608", "RUF001", "RUF003", "SIM105", "SIM905", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "BLE"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["lazarus"]
warn_unused_ignores = false
